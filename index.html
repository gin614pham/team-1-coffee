<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thực đơn — Quán cà phê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Thực đơn</h1>
      <p>Chọn size và topping, thêm vào giỏ, rồi nhập tên và số bàn để đặt.</p>
    </header>

    <div class="layout">
      <section class="menu" id="menu" aria-label="Danh sách món"></section>
      <aside class="cart" aria-label="Giỏ hàng">
        <h2>Giỏ hàng</h2>
        <div id="cart-content"></div>
        <form id="order-form" class="order-form">
          <h2>Đặt món</h2>
          <label class="field">
            Tên người gọi
            <input id="customer-name" name="customerName" type="text" autocomplete="name" />
          </label>
          <label class="field">
            Số bàn
            <input id="table-number" name="tableNumber" type="text" inputmode="numeric" autocomplete="off" />
          </label>
          <p id="order-error" class="order-error" hidden></p>
          <button type="submit" class="btn-order">Đặt</button>
        </form>
      </aside>
    </div>
  </div>

  <script src="js/menu.js"></script>
</body>
</html>
