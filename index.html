<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thực đơn — Quán cà phê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e7eef0;
      --bg-deep: #d5e2e4;
      --ink: #152126;
      --muted: #5a6b71;
      --line: #c5d3d7;
      --panel: #f7fbfc;
      --accent: #1f6f63;
      --accent-hover: #17574e;
      --danger: #a13d45;
      --soldout: #7a868b;
      --shadow: 0 12px 32px rgba(21, 33, 38, 0.08);
      --radius: 18px;
      --font: "Be Vietnam Pro", sans-serif;
      --display: "Fraunces", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 0% 0%, #b9d6d1 0%, transparent 50%),
        radial-gradient(ellipse 55% 40% at 100% 5%, #9eb8c4 0%, transparent 48%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    .wrap {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3.5rem;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .layout {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1.6fr 1fr;
      align-items: start;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .menu {
      display: grid;
      gap: 1rem;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem 1.25rem;
      padding: 1.15rem 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .item.is-soldout {
      opacity: 0.72;
    }

    .emoji {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 1.1rem;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      line-height: 1;
    }

    .item-body {
      display: grid;
      gap: 0.75rem;
    }

    .item-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 1rem;
    }

    .item-top h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .base-price {
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      margin-left: 0.45rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #dde6e9;
      color: var(--soldout);
      font-size: 0.75rem;
      font-weight: 600;
      vertical-align: middle;
    }

    .options {
      display: grid;
      gap: 0.55rem;
    }

    .opt-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.85rem;
      align-items: center;
    }

    .opt-label {
      min-width: 4.5rem;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .opt-row label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .item-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .live-price {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .live-price span {
      color: var(--accent);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    .btn-add,
    .btn-remove {
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      font-weight: 600;
      font-size: 0.92rem;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
    }

    .btn-add:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-add:disabled {
      background: #b7a99c;
      cursor: not-allowed;
    }

    .btn-remove {
      background: transparent;
      color: var(--danger);
      border: 1px solid #e4c4bd;
      padding: 0.35rem 0.8rem;
    }

    .btn-remove:hover {
      background: #f8ece9;
    }

    .cart {
      position: sticky;
      top: 1rem;
      padding: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .cart h2 {
      margin: 0 0 1rem;
      font-family: var(--display);
      font-size: 1.45rem;
    }

    .cart-empty {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .cart-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.85rem;
    }

    .cart-line {
      display: grid;
      gap: 0.35rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--line);
    }

    .cart-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .cart-line-main {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: start;
    }

    .cart-line-title {
      font-weight: 600;
      margin: 0;
    }

    .cart-line-meta {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .cart-line-price {
      font-weight: 600;
      white-space: nowrap;
    }

    .cart-total {
      margin-top: 1.15rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .cart-total strong {
      color: var(--accent);
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Thực đơn</h1>
      <p>Chọn size và topping, xem giá tạm tính rồi thêm vào giỏ.</p>
    </header>

    <div class="layout">
      <section class="menu" id="menu" aria-label="Danh sách món"></section>
      <aside class="cart" aria-label="Giỏ hàng">
        <h2>Giỏ hàng</h2>
        <div id="cart-content"></div>
      </aside>
    </div>
  </div>

  <script>
    const SIZE_EXTRA = { S: 0, M: 5000, L: 10000 };
    const TOPPING_EXTRA = {
      "trân châu": 5000,
      "kem cheese": 10000,
    };

    const MENU = [
      {
        id: "cafe-sua",
        name: "Cà phê sữa đá",
        basePrice: 25000,
        emoji: "☕",
        color: "#c4a484",
        available: true,
      },
      {
        id: "bac-xiu",
        name: "Bạc xỉu",
        basePrice: 30000,
        emoji: "🥛",
        color: "#f0e0c8",
        available: true,
      },
      {
        id: "tra-dao",
        name: "Trà đào cam sả",
        basePrice: 35000,
        emoji: "🍑",
        color: "#f5b895",
        available: true,
      },
      {
        id: "matcha",
        name: "Matcha latte",
        basePrice: 42000,
        emoji: "🍵",
        color: "#a8c686",
        available: false,
      },
      {
        id: "cacao",
        name: "Cacao đá xay",
        basePrice: 38000,
        emoji: "🍫",
        color: "#b08968",
        available: true,
      },
      {
        id: "sinh-to-bo",
        name: "Sinh tố bơ",
        basePrice: 45000,
        emoji: "🥑",
        color: "#9ccc65",
        available: true,
      },
    ];

    const CART_KEY = "coffee-cart";

    function formatVnd(amount) {
      return amount.toLocaleString("vi-VN") + "đ";
    }

    function calcPrice(basePrice, size, toppings) {
      const toppingSum = toppings.reduce(
        (sum, name) => sum + (TOPPING_EXTRA[name] || 0),
        0
      );
      return basePrice + (SIZE_EXTRA[size] || 0) + toppingSum;
    }

    function loadCart() {
      try {
        const raw = localStorage.getItem(CART_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    let cart = loadCart();

    function getItemState(itemId) {
      const root = document.querySelector(`[data-item-id="${itemId}"]`);
      const size = root.querySelector('input[name="size-' + itemId + '"]:checked').value;
      const toppings = [...root.querySelectorAll('input[name="topping-' + itemId + '"]:checked')].map(
        (el) => el.value
      );
      return { size, toppings };
    }

    function updateLivePrice(item) {
      const { size, toppings } = getItemState(item.id);
      const price = calcPrice(item.basePrice, size, toppings);
      const el = document.getElementById("live-" + item.id);
      el.textContent = formatVnd(price);
    }

    function renderMenu() {
      const menuEl = document.getElementById("menu");
      menuEl.innerHTML = MENU.map((item) => {
        const sold = !item.available;
        return `
          <article class="item${sold ? " is-soldout" : ""}" data-item-id="${item.id}">
            <div class="emoji" style="background:${item.color}" aria-hidden="true">${item.emoji}</div>
            <div class="item-body">
              <div class="item-top">
                <h2>
                  ${item.name}
                  ${sold ? '<span class="badge">Hết</span>' : ""}
                </h2>
                <div class="base-price">Giá gốc ${formatVnd(item.basePrice)}</div>
              </div>
              <div class="options">
                <div class="opt-row">
                  <span class="opt-label">Size</span>
                  <label><input type="radio" name="size-${item.id}" value="S" checked /> S</label>
                  <label><input type="radio" name="size-${item.id}" value="M" /> M (+5.000đ)</label>
                  <label><input type="radio" name="size-${item.id}" value="L" /> L (+10.000đ)</label>
                </div>
                <div class="opt-row">
                  <span class="opt-label">Topping</span>
                  <label><input type="checkbox" name="topping-${item.id}" value="trân châu" /> Trân châu (+5.000đ)</label>
                  <label><input type="checkbox" name="topping-${item.id}" value="kem cheese" /> Kem cheese (+10.000đ)</label>
                </div>
              </div>
              <div class="item-foot">
                <div class="live-price">Tạm tính: <span id="live-${item.id}">${formatVnd(item.basePrice)}</span></div>
                <button
                  type="button"
                  class="btn-add"
                  data-add="${item.id}"
                  ${sold ? "disabled" : ""}
                >${sold ? "Hết" : "Thêm vào giỏ"}</button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      MENU.forEach((item) => {
        const root = document.querySelector(`[data-item-id="${item.id}"]`);
        root.querySelectorAll("input").forEach((input) => {
          input.addEventListener("change", () => updateLivePrice(item));
        });
      });

      menuEl.querySelectorAll("[data-add]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = MENU.find((m) => m.id === btn.dataset.add);
          if (!item || !item.available) return;
          const { size, toppings } = getItemState(item.id);
          const price = calcPrice(item.basePrice, size, toppings);
          cart.push({
            lineId: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
            itemId: item.id,
            name: item.name,
            emoji: item.emoji,
            size,
            toppings: [...toppings],
            price,
          });
          saveCart(cart);
          renderCart();
        });
      });
    }

    function cartTotal() {
      return cart.reduce((sum, line) => sum + line.price, 0);
    }

    function renderCart() {
      const el = document.getElementById("cart-content");
      if (!cart.length) {
        el.innerHTML = '<p class="cart-empty">Giỏ đang trống.</p>';
        return;
      }

      el.innerHTML = `
        <ul class="cart-list">
          ${cart
            .map((line) => {
              const toppingText = line.toppings.length
                ? line.toppings.join(", ")
                : "không topping";
              return `
                <li class="cart-line">
                  <div class="cart-line-main">
                    <div>
                      <p class="cart-line-title">${line.emoji} ${line.name}</p>
                      <p class="cart-line-meta">Size ${line.size} · ${toppingText}</p>
                    </div>
                    <div class="cart-line-price">${formatVnd(line.price)}</div>
                  </div>
                  <button type="button" class="btn-remove" data-remove="${line.lineId}">Bỏ</button>
                </li>
              `;
            })
            .join("")}
        </ul>
        <div class="cart-total">
          <span>Tổng tiền</span>
          <strong>${formatVnd(cartTotal())}</strong>
        </div>
      `;

      el.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          cart = cart.filter((line) => line.lineId !== btn.dataset.remove);
          saveCart(cart);
          renderCart();
        });
      });
    }

    renderMenu();
    renderCart();
  </script>
</body>
</html>
